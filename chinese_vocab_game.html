    // ==========================================
    // 2. AUDIO SYNTHESIZER (SOUND EFFECTS)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'victory') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.2, now + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
            o.start(now + i * 0.1);
            o.stop(now + i * 0.1 + 0.3);
          });
        }
      } catch (e) {
        console.warn('Audio play error', e);
      }
    }

    function speakChinese(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }
    }

      const savedUser = sessionStorage.getItem('cn_current_user');

          const userObj = JSON.parse(savedUser);
          // Refresh from DB
          const found = db.users.find(u => u.id === userObj.id);
          if (found) {
            currentUser = found;
            currentRoute = found.role === 'admin' ? 'manager' : 'student';
          }
        } catch (e) {
          sessionStorage.removeItem('cn_current_user');
        }
      }
      renderApp();
    }

    function setSession(user) {
      currentUser = user;
      sessionStorage.setItem('cn_current_user', JSON.stringify(user));
      currentRoute = user.role === 'admin' ? 'manager' : 'student';
      renderApp();
      showToast(`Chào mừng ${user.fullName}!`, '👋');
    }

    function logout() {
      currentUser = null;
      sessionStorage.removeItem('cn_current_user');
      currentRoute = 'login';
      activeTestInstance = null;
      activeArenaGame = null;
      renderApp();
      showToast('Đã đăng xuất tài khoản.', '🔒');

    function startTest(testId) {
      db = loadDB();
      const test = (db.tests || []).find(t => t.id === testId);
      if (!test) return;

      activeTestInstance = {
        test: test,
        currentIndex: 0,
        userAnswers: {},
        timeLeftSeconds: (test.durationMinutes || 10) * 60,
        timerInterval: null
      };

      currentRoute = 'test_runner';
      renderApp();

      // Start countdown
      activeTestInstance.timerInterval = setInterval(() => {
        if (!activeTestInstance) return;
        activeTestInstance.timeLeftSeconds--;
        const timerEl = document.getElementById('testTimerDisplay');
        if (timerEl) {
          const mins = Math.floor(activeTestInstance.timeLeftSeconds / 60);
          const secs = activeTestInstance.timeLeftSeconds % 60;
          timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
          if (activeTestInstance.timeLeftSeconds <= 60) timerEl.classList.add('text-rose-500', 'animate-pulse');
        }

        if (activeTestInstance.timeLeftSeconds <= 0) {
          clearInterval(activeTestInstance.timerInterval);
          submitTest(true);
        }
      }, 1000);
    }

      }

    function submitTest(isAutoTimeout = false) {
      clearInterval(activeTestInstance.timerInterval);
      const t = activeTestInstance.test;
      let correct = 0;
      const details = [];

      t.questions.forEach((q, i) => {
        const userAns = (activeTestInstance.userAnswers[i] || '').trim().toLowerCase();
        const correctAns = q.answer.trim().toLowerCase();
        const isRight = userAns === correctAns;
        if (isRight) correct++;
        details.push({
          qIndex: i,
          prompt: q.prompt,
          studentAnswer: activeTestInstance.userAnswers[i] || '(Chưa làm)',
          correctAnswer: q.answer,
          explanation: q.explanation || '',
          correct: isRight
        });
      });

      const score = Math.round((correct / t.questions.length) * 100);
      const submissionId = 'sub_' + Date.now();

      db = loadDB();
      if (!db.submissions) db.submissions = [];
      db.submissions.unshift({
        id: submissionId,
        testId: t.id,
        studentId: currentUser.id,
        studentName: currentUser.fullName,
        level: currentUser.level,
        score: score,
        totalQuestions: t.questions.length,
        correctCount: correct,
        submittedAt: new Date().toLocaleString('vi-VN'),
        details: details
      });

      // Update student EXP and badges
      const studentIdx = db.users.findIndex(u => u.id === currentUser.id);
      if (studentIdx !== -1) {
        db.users[studentIdx].exp = (db.users[studentIdx].exp || 0) + (score >= 50 ? score : 20);
        if (!db.users[studentIdx].badges) db.users[studentIdx].badges = [];
        if (!db.users[studentIdx].badges.includes('first_test')) db.users[studentIdx].badges.push('first_test');
        if (score === 100 && !db.users[studentIdx].badges.includes('perfect_score')) db.users[studentIdx].badges.push('perfect_score');
      }

      saveDB(db);
      playSound(score >= 50 ? 'victory' : 'wrong');

      // Show result screen
      renderTestResultModal(t, score, correct, t.questions.length, details);
      activeTestInstance = null;
      currentRoute = 'student';
      renderApp();
    }

    // ==========================================
    // 9. STUDENT FILE UPLOAD & WORD PARSER (SHEETJS)
    // ==========================================
    function handleStudentUploadFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

          if (!rows || rows.length < 2) {
            alert('File rỗng hoặc không đủ dữ liệu.');
            return;
          }

          // Scan columns for Chinese characters
          let hanziIdx = -1;
          for (let r = 0; r < Math.min(10, rows.length); r++) {
            const row = rows[r];
            for (let c = 0; c < row.length; c++) {
              if (/[\u4e00-\u9fff]/.test(String(row[c]))) {
                hanziIdx = c;
                break;
              }
            }
            if (hanziIdx !== -1) break;
          }

          if (hanziIdx === -1) {
            alert('Không tìm thấy cột chữ Hán trong file Excel!');
            return;
          }

          const parsedWords = [];
          for (let r = 1; r < rows.length; r++) {
            const row = rows[r];
            if (!row || row.length <= hanziIdx) continue;
            const hz = String(row[hanziIdx] || '').trim();
            if (!hz || !/[\u4e00-\u9fff]/.test(hz)) continue;

            const py = String(row[hanziIdx + 1] || '').trim() || hz;
            const type = String(row[hanziIdx + 2] || '').trim() || 'Từ vựng';
            const mean = String(row[hanziIdx + 3] || '').trim() || 'Chưa có nghĩa';
            const exCN = String(row[hanziIdx + 4] || '').trim();
            const exVN = String(row[hanziIdx + 6] || '').trim();

            parsedWords.push({
              hanzi: hz,
              pinyin: py,
              type: type,
              meaning: mean,
              exampleCN: exCN,
              exampleVN: exVN
            });
          }

          if (parsedWords.length === 0) {
            alert('Không trích xuất được từ vựng hợp lệ.');
            return;
          }

          // Save to student profile in database!
          db = loadDB();
          const studentIdx = db.users.findIndex(u => u.id === currentUser.id);
          if (studentIdx !== -1) {
            db.users[studentIdx].currentFile = {
              fileName: file.name,
              wordCount: parsedWords.length,
              words: parsedWords
            };
            saveDB(db);
            currentUser = db.users[studentIdx];
            showToast(`Đã nạp thành công ${parsedWords.length} từ từ file ${file.name}!`, '🎉');
            renderApp();
          }

        } catch (err) {
          console.error(err);
          alert('Lỗi đọc file Excel: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    let arenaWords = [];

    // GAME: FLASHCARD
    function initArenaFlashcard(canvas) {
      const words = [...arenaWords];
      let idx = 0;
      let isFlipped = false;

      function draw() {
        const w = words[idx];
        canvas.innerHTML = `
          <div class="max-w-md mx-auto space-y-6 text-center">
            <div class="flex items-center justify-between text-xs font-bold text-slate-400">
              <button onclick="arenaCurrentGame = null; renderApp();" class="hover:text-rose-600">&larr; Chọn Game Khác</button>
              <span>${idx + 1} / ${words.length}</span>
            </div>

            <div onclick="window._flipFC()" class="glass-card cursor-pointer rounded-3xl p-10 min-h-[300px] flex flex-col items-center justify-center shadow-2xl border border-white/20 card-hover transition-all">
              ${!isFlipped ? `
                <div class="hanzi-huge font-black text-slate-800">${w.hanzi}</div>
                <div class="text-base font-bold text-rose-600 mt-2 min-h-[24px]">${arenaShowPinyin ? w.pinyin : ''}</div>
                <div class="text-xs font-bold text-slate-400 mt-6">Bấm vào thẻ để lật xem nghĩa &rarr;</div>
              ` : `
                <div class="text-2xl font-black text-emerald-600 mb-2">${w.meaning}</div>
                <div class="text-xs font-bold text-slate-400">(${w.type})</div>
                ${w.exampleCN ? `<div class="text-xs text-slate-600 mt-4 italic">${w.exampleCN}</div>` : ''}
              `}
            </div>

            <div class="flex items-center justify-center gap-3">
              <button onclick="speakChinese('${w.hanzi}')" class="p-3.5 rounded-2xl bg-white border border-slate-200 text-xl shadow-sm hover:scale-110 transition-transform">🔊</button>
              <button onclick="window._prevFC()" class="px-5 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-all">Trước</button>
              <button onclick="window._nextFC()" class="px-6 py-3 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-md transition-all">Tiếp theo &rarr;</button>
            </div>
          </div>
        `;
      }

      window._flipFC = () => { isFlipped = !isFlipped; draw(); };
      window._prevFC = () => { if (idx > 0) { idx--; isFlipped = false; draw(); } };
      window._nextFC = () => { if (idx < words.length - 1) { idx++; isFlipped = false; draw(); } else { alert('Bạn đã xem hết các từ!'); } };
      draw();
    }

    // GAME: QUIZ
    function initArenaQuiz(canvas) {
      const words = [...arenaWords];
      let idx = 0;
      let score = 0;
      let lives = 3;

      function draw() {
        const w = words[idx];
        const others = arenaWords.filter(x => x.hanzi !== w.hanzi).sort(() => 0.5 - Math.random()).slice(0, 3);
        const options = [w, ...others].sort(() => 0.5 - Math.random());

        canvas.innerHTML = `
          <div class="max-w-lg mx-auto space-y-6">
            <div class="flex items-center justify-between text-xs font-bold">
              <button onclick="arenaCurrentGame = null; renderApp();" class="text-slate-400 hover:text-rose-600">&larr; Dừng chơi</button>
              <span class="text-base tracking-widest">${'❤️'.repeat(lives)}</span>
              <span class="text-slate-400">${idx + 1} / ${words.length}</span>
            </div>

            <div class="glass-card rounded-3xl p-8 text-center shadow-xl border border-white/20">
              <div class="text-xs font-bold text-slate-400 uppercase mb-2">Chọn nghĩa đúng của từ:</div>
              <div class="hanzi-large font-black text-slate-800">${w.hanzi}</div>
              <div class="text-sm font-bold text-rose-600 mt-1 min-h-[20px]">${arenaShowPinyin ? w.pinyin : ''}</div>
              <button onclick="speakChinese('${w.hanzi}')" class="mt-2 text-xl hover:scale-110 transition-transform">🔊</button>
            </div>

            <div class="grid grid-cols-2 gap-3" id="arenaQuizOpts">
              ${options.map(opt => `
                <button onclick="window._answerArenaQuiz('${opt.hanzi}', '${w.hanzi}', this)" class="p-4 rounded-2xl bg-white border-2 border-slate-200 font-bold text-sm text-slate-700 hover:border-rose-400 card-hover transition-all text-center">
                  ${opt.meaning}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      window._answerArenaQuiz = (chosen, correct, btn) => {
        const isRight = chosen === correct;
        if (isRight) {
          btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
          playSound('correct');
          showFloatScore('+10', 'text-emerald-500');
          score++;
        } else {
          btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-700', 'shake');
          playSound('wrong');
          lives--;
        }

        setTimeout(() => {
          if (lives <= 0) {
            alert(`Hết mạng! Điểm của bạn: ${score}`);
            arenaCurrentGame = null;
            renderApp();
            return;
          }
          idx++;
          if (idx >= words.length) {
            alert(`Hoàn thành! Bạn trả lời đúng ${score}/${words.length} từ.`);
            arenaCurrentGame = null;
            renderApp();
          } else {
            draw();
          }
        }, 800);
      };

      draw();
    }

    // GAME: SPEED
    function initArenaSpeed(canvas) {
      let timeLeft = 60;
      let score = 0;
      let timer = setInterval(() => {
        timeLeft--;
        const el = document.getElementById('arenaSpeedTimer');
        if (el) el.textContent = `⏱️ ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          alert(`Hết giờ! Bạn ghi được ${score} điểm!`);
          arenaCurrentGame = null;
          renderApp();
        }
      }, 1000);

      function draw() {
        const w = arenaWords[Math.floor(Math.random() * arenaWords.length)];
        const others = arenaWords.filter(x => x.hanzi !== w.hanzi).sort(() => 0.5 - Math.random()).slice(0, 3);
        const options = [w, ...others].sort(() => 0.5 - Math.random());

        canvas.innerHTML = `
          <div class="max-w-md mx-auto space-y-6">
            <div class="flex items-center justify-between text-xs font-bold">
              <button onclick="clearInterval(${timer}); arenaCurrentGame = null; renderApp();" class="text-slate-400 hover:text-rose-600">&larr; Dừng sớm</button>
              <span id="arenaSpeedTimer" class="text-lg font-black text-rose-500">⏱️ ${timeLeft}s</span>
              <span class="text-base font-black text-amber-500">⭐ ${score}</span>
            </div>

            <div class="glass-card rounded-3xl p-8 text-center shadow-xl border border-white/20">
              <div class="hanzi-large font-black text-slate-800">${w.hanzi}</div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              ${options.map(opt => `
                <button onclick="window._answerArenaSpeed('${opt.hanzi}', '${w.hanzi}')" class="p-4 rounded-2xl bg-white border-2 border-slate-200 font-bold text-sm text-slate-700 hover:border-rose-400 transition-all text-center">
                  ${opt.meaning}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      window._answerArenaSpeed = (chosen, correct) => {
        if (chosen === correct) {
          playSound('correct');
          score += 10;
        } else {
          playSound('wrong');
        }
        draw();
      };

      draw();
    }

    // GAME: LISTEN
    function initArenaListen(canvas) {
      let idx = 0;
      let score = 0;

      function draw() {
        const w = arenaWords[idx];
        const others = arenaWords.filter(x => x.hanzi !== w.hanzi).sort(() => 0.5 - Math.random()).slice(0, 3);
        const options = [w, ...others].sort(() => 0.5 - Math.random());

        canvas.innerHTML = `

            <div class="flex items-center justify-between text-xs font-bold text-slate-400">
              <button onclick="arenaCurrentGame = null; renderApp();" class="hover:text-rose-600">&larr; Menu</button>
              <span>${idx + 1} / ${arenaWords.length}</span>
            </div>

            <div class="glass-card rounded-3xl p-8 shadow-xl border border-white/20 space-y-4">
              <div class="text-xs font-bold text-slate-400 uppercase">Nghe và chọn Hán tự đúng:</div>
              <button onclick="speakChinese('${w.hanzi}')" class="text-6xl hover:scale-110 transition-transform">🔊</button>
              <div class="text-sm font-bold text-slate-600">Nghĩa: <b>${w.meaning}</b></div>
            </div>

            <div class="grid grid-cols-2 gap-3">

                <button onclick="window._answerArenaListen('${opt.hanzi}', '${w.hanzi}')" class="p-5 rounded-2xl bg-white border-2 border-slate-200 font-bold text-xl text-slate-800 hover:border-rose-400 transition-all">
                  ${opt.hanzi}
                </button>
              `).join('')}
            </div>
          </div>

        setTimeout(() => speakChinese(w.hanzi), 300);
      }

      window._answerArenaListen = (chosen, correct) => {
        if (chosen === correct) {
          playSound('correct');
          score++;
        } else {
          playSound('wrong');
        }
        idx++;
        if (idx >= arenaWords.length) {
          alert(`Hoàn thành! Bạn đúng ${score}/${arenaWords.length}`);
          arenaCurrentGame = null;
          renderApp();
        } else {
          draw();
        }
      };

      draw();
    }

    function handleCreateStudentSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('newStudentName').value.trim();
      const user = document.getElementById('newStudentUsername').value.trim();
      const pass = document.getElementById('newStudentPassword').value.trim();
      const level = document.getElementById('newStudentLevel').value;

      db = loadDB();
      if (db.users.some(u => u.username.toLowerCase() === user.toLowerCase())) {
        alert('Tên đăng nhập đã tồn tại!');
        return;
      }

      db.users.push({
        id: 'u_' + Date.now(),
        fullName: name,
        username: user,
        password: pass,
        role: 'student',
        level: level,
        exp: 0,
        streak: 0,
        currentFile: null,
        vocabStats: {},
        badges: [],
        createdAt: new Date().toISOString().split('T')[0]
      });

      saveDB(db);
      document.getElementById('modalHost').innerHTML = '';
      showToast(`Đã thêm học viên ${name}!`, '🎉');
      renderApp();
    }

                <input type="number" id="newTestDuration" value="10" min="1" max="60" class="w-32 px-4 py-2 rounded-xl border border-slate-200 text-sm font-bold">
              </div>

              <!-- QUESTIONS BUILDER CONTAINER -->
              <div>
                <div class="flex items-center justify-between mb-2">
                  <label class="text-xs font-bold text-slate-500 uppercase">Danh Sách Câu Hỏi (<span id="testQCount">1</span>)</label>
                  <button type="button" onclick="addNewQuestionRow()" class="text-xs font-bold text-rose-600 hover:underline">+ Thêm Câu Hỏi</button>
                </div>
                <div id="questionsBuilderContainer" class="space-y-3">
                  <!-- Row 1 -->
                  <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3 q-builder-item">
                    <div class="flex items-center justify-between text-xs font-bold text-slate-400">
                      <span>Câu #1</span>
                      <select class="q-type-select text-xs font-bold px-2 py-1 rounded-lg border border-slate-200">
                        <option value="mcq">Trắc nghiệm A B C D</option>
                        <option value="fill">Điền từ vào chỗ trống</option>
                      </select>
                    </div>
                    <input type="text" placeholder="Nội dung câu hỏi (VD: Từ '你好' có nghĩa là gì?)" class="q-prompt w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold">
                    <div class="grid grid-cols-2 gap-2">
                      <input type="text" placeholder="Đáp án A" class="q-opt-a px-3 py-2 rounded-xl border border-slate-200 text-xs">
                      <input type="text" placeholder="Đáp án B" class="q-opt-b px-3 py-2 rounded-xl border border-slate-200 text-xs">
                      <input type="text" placeholder="Đáp án C" class="q-opt-c px-3 py-2 rounded-xl border border-slate-200 text-xs">
                      <input type="text" placeholder="Đáp án D" class="q-opt-d px-3 py-2 rounded-xl border border-slate-200 text-xs">
                    </div>
                    <input type="text" placeholder="Đáp án ĐÚNG CHÍNH XÁC (Trùng với 1 trong các đáp án)" class="q-answer w-full px-3 py-2 rounded-xl border-2 border-emerald-400 text-xs font-bold text-emerald-800">
                  </div>
                </div>
              </div>

              <button onclick="handleSaveNewTest()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-rose-600 to-amber-600 text-white font-bold text-sm shadow-md hover:opacity-95 transition-all">
                Lưu & Phát Hành Đề Test Cho Học Viên &rarr;
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function addNewQuestionRow() {
      const container = document.getElementById('questionsBuilderContainer');
      const count = container.querySelectorAll('.q-builder-item').length + 1;
      const div = document.createElement('div');
      div.className = 'p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3 q-builder-item';
      div.innerHTML = `
        <div class="flex items-center justify-between text-xs font-bold text-slate-400">
          <span>Câu #${count}</span>
          <select class="q-type-select text-xs font-bold px-2 py-1 rounded-lg border border-slate-200">
            <option value="mcq">Trắc nghiệm A B C D</option>
            <option value="fill">Điền từ vào chỗ trống</option>
          </select>
        </div>
        <input type="text" placeholder="Nội dung câu hỏi..." class="q-prompt w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" placeholder="Đáp án A" class="q-opt-a px-3 py-2 rounded-xl border border-slate-200 text-xs">
          <input type="text" placeholder="Đáp án B" class="q-opt-b px-3 py-2 rounded-xl border border-slate-200 text-xs">
          <input type="text" placeholder="Đáp án C" class="q-opt-c px-3 py-2 rounded-xl border border-slate-200 text-xs">
          <input type="text" placeholder="Đáp án D" class="q-opt-d px-3 py-2 rounded-xl border border-slate-200 text-xs">
        </div>
        <input type="text" placeholder="Đáp án ĐÚNG CHÍNH XÁC" class="q-answer w-full px-3 py-2 rounded-xl border-2 border-emerald-400 text-xs font-bold text-emerald-800">
      `;
      container.appendChild(div);
      document.getElementById('testQCount').textContent = count;
    }

    function handleSaveNewTest() {
      const title = document.getElementById('newTestTitle').value.trim();
      const level = document.getElementById('newTestLevel').value;
      const duration = parseInt(document.getElementById('newTestDuration').value) || 10;

      if (!title) {
        alert('Vui lòng nhập tên bài test!');
        return;
      }

      const rows = document.querySelectorAll('.q-builder-item');
      const questions = [];

      rows.forEach((r, idx) => {
        const prompt = r.querySelector('.q-prompt').value.trim();
        const ans = r.querySelector('.q-answer').value.trim();
        const type = r.querySelector('.q-type-select').value;
        const optA = r.querySelector('.q-opt-a').value.trim();
        const optB = r.querySelector('.q-opt-b').value.trim();
        const optC = r.querySelector('.q-opt-c').value.trim();
        const optD = r.querySelector('.q-opt-d').value.trim();

        if (prompt && ans) {
          questions.push({
            id: 'q_' + (idx + 1),
            type: type,
            prompt: prompt,
            options: [optA || ans, optB || 'Đáp án 2', optC || 'Đáp án 3', optD || 'Đáp án 4'],
            answer: ans,
            explanation: 'Đáp án chuẩn: ' + ans
          });
        }
      });

      if (questions.length === 0) {
        alert('Vui lòng nhập ít nhất 1 câu hỏi hợp lệ!');
        return;
      }

      db = loadDB();
      if (!db.tests) db.tests = [];
      db.tests.unshift({
        id: 'test_' + Date.now(),
        title: title,
        level: level,
        durationMinutes: duration,
        targetType: 'LEVEL',
        targetLevel: level,
        createdAt: new Date().toISOString().split('T')[0],
        questions: questions
      });

      saveDB(db);
      document.getElementById('modalHost').innerHTML = '';
      showToast(`Đã lưu bài test "${title}"!`, '🎉');
      renderApp();
    }

    function deleteTest(id) {
      if (confirm('Bạn có chắc muốn xoá đề thi này?')) {
        db = loadDB();
        db.tests = db.tests.filter(t => t.id !== id);
        saveDB(db);
        showToast('Đã xoá đề thi.', '🗑️');
        renderApp();
      }
    }

    function previewTest(id) {
      db = loadDB();
      const t = db.tests.find(x => x.id === id);
      if (!t) return;
      alert(`Đề thi: ${t.title}\nCấp độ: ${t.level}\nSố câu: ${t.questions.length}\nThời gian: ${t.durationMinutes} phút`);
    }

    function viewSubmissionDetail(subId) {
      db = loadDB();
      const sub = db.submissions.find(s => s.id === subId);
      if (!sub) return;

      const modal = document.getElementById('modalHost');
      modal.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl border border-white/20 pop-in space-y-6 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <div>
                <h3 class="text-lg font-black text-slate-800">${sub.studentName}</h3>
                <span class="text-xs text-slate-400">Điểm: <b class="text-emerald-600 text-sm">${sub.score}/100</b> (${sub.submittedAt})</span>
              </div>
              <button onclick="document.getElementById('modalHost').innerHTML=''" class="text-slate-400 hover:text-rose-600 text-2xl font-bold">&times;</button>
            </div>

            <div class="space-y-3">
              ${(sub.details || []).map((d, i) => `
                <div class="p-3.5 rounded-xl border ${d.correct ? 'border-emerald-200 bg-emerald-50/50' : 'border-rose-200 bg-rose-50/50'} text-xs space-y-1">
                  <div class="font-bold text-slate-800">Câu ${i + 1}: ${d.prompt || ''}</div>
                  <div>Học viên trả lời: <b class="${d.correct ? 'text-emerald-700' : 'text-rose-700'}">${d.studentAnswer}</b></div>
                  ${!d.correct ? `<div>Đáp án đúng: <b class="text-emerald-700">${d.correctAnswer}</b></div>` : ''}
                </div>
              `).join('')}
            </div>

            <button onclick="document.getElementById('modalHost').innerHTML=''" class="w-full py-3 rounded-xl bg-slate-900 text-white font-bold text-xs">Đóng</button>
          </div>
        </div>
      `;
    }

    // WORD BANK MODAL
    function openWordBankModal() {
      const modal = document.getElementById('modalHost');
      const list = arenaWords;
      modal.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-3xl w-full shadow-2xl border border-white/20 pop-in space-y-4 max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 class="text-lg font-black text-slate-800">📖 Kho Từ Vựng (${list.length} từ)</h3>
              <button onclick="document.getElementById('modalHost').innerHTML=''" class="text-slate-400 hover:text-rose-600 text-2xl font-bold">&times;</button>
            </div>

            <div class="flex-1 overflow-y-auto space-y-2 pr-1">
              <table class="w-full text-left text-sm">
                <thead>
                  <tr class="text-xs font-black text-slate-400 uppercase border-b border-slate-100">
                    <th class="py-2">Chữ Hán</th>
                    <th class="py-2">Pinyin</th>
                    <th class="py-2">Nghĩa Tiếng Việt</th>
                    <th class="py-2 text-center">Nghe</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${list.map(w => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3 font-bold text-base text-slate-800">${w.hanzi}</td>
                      <td class="py-3 font-semibold text-rose-600">${w.pinyin}</td>
                      <td class="py-3 text-slate-600 font-medium">${w.meaning}</td>
                      <td class="py-3 text-center">
                        <button onclick="speakChinese('${w.hanzi}')" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200">🔊</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <button onclick="document.getElementById('modalHost').innerHTML=''" class="w-full py-3 rounded-xl bg-slate-900 text-white font-bold text-xs">Đóng</button>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 12. ROUTER & ROOT APP RENDERER
    // ==========================================
    function renderApp() {
      const view = document.getElementById('appView');
      if (!view) return;

      if (!currentUser || currentRoute === 'login') {
        view.innerHTML = renderLoginView();
      } else if (currentRoute === 'manager') {
        view.innerHTML = renderManagerView();
      } else if (currentRoute === 'student') {
        view.innerHTML = renderStudentView();
      } else if (currentRoute === 'test_runner') {
        view.innerHTML = renderTestRunnerView();
      } else if (currentRoute === 'game_arena') {
        view.innerHTML = renderVocabArenaView();
      }
    }

    // STARTUP
    checkSession();
  </script>
</body>
</html>
