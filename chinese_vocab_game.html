    function getAllWordsForLevel(level) {
      let list = [];
      if (BUILTIN_HSK_VOCAB[level]) {
        list = list.concat(BUILTIN_HSK_VOCAB[level]);
      }
      try {
        const curDB = loadDB();
        (curDB.users || []).forEach(u => {
          if (u.currentFile && Array.isArray(u.currentFile.words)) {
            if (u.level === level || level === 'ALL') {
              list = list.concat(u.currentFile.words);
            }
          }
        });
      } catch (e) {
        console.error('Error fetching student vocab:', e);
      }

      if (list.length < 5) {
        Object.values(BUILTIN_HSK_VOCAB).forEach(arr => {
          list = list.concat(arr);
        });
      }

      const seen = new Set();
      const unique = [];
      for (const w of list) {
        if (w && w.hanzi && !seen.has(w.hanzi)) {
          seen.add(w.hanzi);
          unique.push(w);
        }
      }
      return unique;
    }

    function generateQuestionsFromWords(wordPool, count = 10, allowedTypes = ['mcq', 'fill', 'true_false', 'arrange']) {
      if (!wordPool || wordPool.length === 0) return [];
      if (!allowedTypes || allowedTypes.length === 0) allowedTypes = ['mcq', 'fill', 'true_false', 'arrange'];
      
      const pool = [...wordPool].sort(() => 0.5 - Math.random());
      const questions = [];

      for (let i = 0; i < count; i++) {
        const target = pool[i % pool.length];
        const type = allowedTypes[i % allowedTypes.length];
        const otherWords = pool.filter(w => w.hanzi !== target.hanzi);

        if (type === 'mcq') {
          const isHanziToVN = Math.random() > 0.4;
          if (isHanziToVN) {
            const distractors = otherWords.sort(() => 0.5 - Math.random()).slice(0, 3).map(w => w.meaning || 'Đáp án');
            while (distractors.length < 3) distractors.push('Lựa chọn ' + (distractors.length + 1));
            const opts = [target.meaning, ...distractors].sort(() => 0.5 - Math.random());
            questions.push({
              id: 'q_' + (i + 1),
              type: 'mcq',
              prompt: `Hán tự "${target.hanzi}" (${target.pinyin || ''}) có nghĩa là gì trong tiếng Việt?`,
              pinyin: target.pinyin,
              options: opts,
              answer: target.meaning,
              explanation: `"${target.hanzi}" (${target.pinyin || ''}) có nghĩa là "${target.meaning}". ${target.exampleCN ? 'Ví dụ: ' + target.exampleCN + ' (' + target.exampleVN + ')' : ''}`
            });
          } else {
            const distractors = otherWords.sort(() => 0.5 - Math.random()).slice(0, 3).map(w => w.hanzi);
            while (distractors.length < 3) distractors.push('词汇' + (distractors.length + 1));
            const opts = [target.hanzi, ...distractors].sort(() => 0.5 - Math.random());
            questions.push({
              id: 'q_' + (i + 1),
              type: 'mcq',
              prompt: `Từ nào trong tiếng Trung có nghĩa là "${target.meaning}"?`,
              options: opts,
              answer: target.hanzi,
              explanation: `"${target.hanzi}" (${target.pinyin || ''}) có nghĩa là "${target.meaning}".`
            });
          }
        } else if (type === 'fill') {
          let promptText = '';
          if (target.exampleCN && target.exampleCN.includes(target.hanzi)) {
            promptText = `Điền từ thích hợp vào câu: "${target.exampleCN.replace(target.hanzi, '【 _____ 】')}" (${target.exampleVN || target.meaning})`;
          } else {
            promptText = `Điền từ Hán tự có phiên âm "${target.pinyin || ''}" mang nghĩa "${target.meaning}": 【 _____ 】`;
          }
          questions.push({
            id: 'q_' + (i + 1),
            type: 'fill',
            prompt: promptText,
            hint: `${target.pinyin || ''} (${target.meaning})`,
            answer: target.hanzi,
            explanation: `Từ cần điền là "${target.hanzi}" (${target.pinyin || ''}): "${target.meaning}".`
          });
        } else if (type === 'true_false') {
          const isTrue = Math.random() > 0.5;
          if (isTrue || otherWords.length === 0) {
            questions.push({
              id: 'q_' + (i + 1),
              type: 'true_false',
              prompt: `Phán đoán Đúng hay Sai: Hán tự "${target.hanzi}" (${target.pinyin || ''}) có nghĩa là "${target.meaning}".`,
              answer: '对 (Đúng)',
              explanation: `Khẳng định này chính xác! "${target.hanzi}" (${target.pinyin || ''}) nghĩa là "${target.meaning}".`
            });
          } else {
            const falseWord = otherWords[Math.floor(Math.random() * otherWords.length)];
            questions.push({
              id: 'q_' + (i + 1),
              type: 'true_false',
              prompt: `Phán đoán Đúng hay Sai: Hán tự "${target.hanzi}" (${target.pinyin || ''}) có nghĩa là "${falseWord.meaning}".`,
              answer: '错 (Sai)',
              explanation: `Khẳng định này là Sai! "${target.hanzi}" (${target.pinyin || ''}) thực tế có nghĩa là "${target.meaning}", còn "${falseWord.meaning}" là nghĩa của "${falseWord.hanzi}".`
            });
          }
        } else if (type === 'arrange') {
          let parts = target.arrange && target.arrange.length > 1 ? [...target.arrange] : null;
          if (!parts && target.exampleCN) {
            const clean = target.exampleCN.replace(/[，。？！、\s]/g, '');
            if (clean.length >= 4) {
              parts = [clean.slice(0, 2), clean.slice(2, 4), clean.slice(4)].filter(Boolean);
            }
          }
          if (!parts || parts.length < 2) {
            parts = [target.hanzi, '很', '好'];
          }
          const shuffledParts = [...parts].sort(() => 0.5 - Math.random());
          questions.push({
            id: 'q_' + (i + 1),
            type: 'arrange',
            prompt: `Sắp xếp các cụm từ sau thành câu tiếng Trung hoàn chỉnh: "${target.exampleVN || target.meaning}"`,
            parts: shuffledParts,
            answer: parts.join(' '),
            explanation: `Câu hoàn chỉnh: "${target.exampleCN || parts.join('')}" (${target.exampleVN || target.meaning}).`
          });
        }
      }
      return questions;
    }

    async function pullFromCloud(silent = true) {
      if (!supabaseClient) return;
      try {
        const [usersRes, testsRes, subsRes] = await Promise.all([
          supabaseClient.from('chinese_users').select('*'),
          supabaseClient.from('chinese_tests').select('*'),
          supabaseClient.from('chinese_submissions').select('*').order('submitted_at', { ascending: false })
        ]);

        if (usersRes.data && usersRes.data.length > 0) {
          db.users = usersRes.data.map(u => ({
            id: u.id,
            username: u.username,
            password: u.password,
            fullName: u.full_name,
            role: u.role,
            level: u.level,
            exp: u.exp,
            streak: u.streak,
            currentFile: u.current_file,
            vocabStats: u.vocab_stats || {},
            badges: u.badges || [],
            createdAt: u.created_at
          }));
        }

        if (testsRes.data && testsRes.data.length > 0) {
          db.tests = testsRes.data.map(t => {
            let questions = t.questions || [];
            let targetType = t.target_type || 'LEVEL';
            let targetStudentIds = t.target_student_ids || [];
            if (questions.length > 0 && questions[0] && questions[0]._testMeta) {
              targetType = questions[0]._testMeta.targetType || targetType;
              targetStudentIds = questions[0]._testMeta.targetStudentIds || targetStudentIds;
              questions = questions.slice(1);
            }
            return {
              id: t.id,
              title: t.title,
              level: t.level,
              durationMinutes: t.duration_minutes,
              targetType: targetType,
              targetStudentIds: targetStudentIds,
              questions: questions,
              createdAt: t.created_at
            };
          });
        }

        if (subsRes.data) {
          db.submissions = subsRes.data.map(s => ({
            id: s.id,
            testId: s.test_id,
            studentId: s.student_id,
            studentName: s.student_name,
            level: s.level,
            score: s.score,
            totalQuestions: s.total_questions,
            correctCount: s.correct_count,
            details: s.details,
            submittedAt: s.submitted_at
          }));
        }

        saveDB(db);
        if (currentUser) {
          currentUser = db.users.find(u => u.id === currentUser.id) || currentUser;
        }
        renderApp();
        if (!silent) showToast('Đồng bộ dữ liệu Supabase Cloud thành công!', '☁️');
      } catch (err) {
        console.warn('Pull cloud error:', err);
      }
    }

    function setupRealtimeSubscriptions() {

    function handleSaveProfile(e) {
      e.preventDefault();
      let newUsername = document.getElementById('inputProfileUsername').value.trim().replace(/^@+/, '');
      const newName = document.getElementById('inputProfileFullName').value.trim();
      const newPass = document.getElementById('inputProfilePassword').value.trim();
      const newPassConfirm = document.getElementById('inputProfilePasswordConfirm').value.trim();

      if (!newUsername) {
        alert('Vui lòng nhập bí danh!');
        return;
      }
      if (!newName) {
        alert('Vui lòng nhập họ và tên!');
        return;
      }
      if (!newPass) {
        alert('Vui lòng nhập mật khẩu!');
        return;
      }
      if (newPass !== newPassConfirm) {
        alert('Mật khẩu xác nhận không khớp! Vui lòng kiểm tra lại.');
        return;
      }

      db = loadDB();
      const existingUser = db.users.find(u => u.username.toLowerCase() === newUsername.toLowerCase() && u.id !== currentUser.id);
      if (existingUser) {
        alert(`Bí danh "@${newUsername}" đã có người khác sử dụng. Vui lòng chọn bí danh khác!`);
        return;
      }

      // Update current user
      currentUser.username = newUsername;
      currentUser.fullName = newName;
      currentUser.password = newPass;
      sessionStorage.setItem('cn_current_user', JSON.stringify(currentUser));

      // Update local db
      const uIdx = db.users.findIndex(u => u.id === currentUser.id);
      if (uIdx !== -1) {
        db.users[uIdx].username = newUsername;
        db.users[uIdx].fullName = newName;
        db.users[uIdx].password = newPass;
      }

      // If name or username changed, also update submission records
      if (db.submissions) {
        db.submissions.forEach(sub => {
          if (sub.studentId === currentUser.id) {
            sub.studentName = newName;
          }
        });
      }
      saveDB(db);

      // Update cloud Supabase
      if (supabaseClient) {
        supabaseClient.from('chinese_users').update({
          username: newUsername,
          full_name: newName,
          password: newPass
        }).eq('id', currentUser.id).then(() => {
          console.log('Profile and username synced to Supabase Cloud!');
        });
      }

      document.getElementById('modalHost').innerHTML = '';
      showToast('Đã cập nhật Bí danh, Họ tên và Mật khẩu thành công!', '🎉');
      renderApp();
    }

    // ==========================================
    // 2. AUDIO SYNTHESIZER (SOUND EFFECTS)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'victory') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.2, now + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
            o.start(now + i * 0.1);
            o.stop(now + i * 0.1 + 0.3);
          });
        }
      } catch (e) {
        console.warn('Audio play error', e);
      }
    }

    function speakChinese(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      }
    }

    function normalizePinyin(text) {
      if (!text) return '';
      return text.toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/ü/g, 'v')
        .replace(/[^a-z0-9]/g, '')
        .trim();
    }

    // ==========================================
    // 8. TEST RUNNER (INTERACTIVE TEST TAKING)
    // ==========================================
    function startTest(testId) {
      db = loadDB();
      const test = (typeof testId === 'object' && testId !== null) ? testId : (db.tests || []).find(t => t.id === testId);
      if (!test) return;

      activeTestInstance = {
        test: test,
        currentIndex: 0,
        userAnswers: {},
        timeLeftSeconds: (test.durationMinutes || 10) * 60,
        timerInterval: null
      };

      currentRoute = 'test_runner';
      renderApp();

      // Start countdown
      activeTestInstance.timerInterval = setInterval(() => {
        if (!activeTestInstance) return;
        activeTestInstance.timeLeftSeconds--;
        const timerEl = document.getElementById('testTimerDisplay');
        if (timerEl) {
          const mins = Math.floor(activeTestInstance.timeLeftSeconds / 60);
          const secs = activeTestInstance.timeLeftSeconds % 60;
          timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
          if (activeTestInstance.timeLeftSeconds <= 60) timerEl.classList.add('text-rose-500', 'animate-pulse');
        }

        if (activeTestInstance.timeLeftSeconds <= 0) {
          clearInterval(activeTestInstance.timerInterval);
          submitTest(true);
        }
      }, 1000);
    }

    function renderTestRunnerView() {
      if (!activeTestInstance) return '';
      const t = activeTestInstance.test;
      const q = t.questions[activeTestInstance.currentIndex];
      const totalQ = t.questions.length;
      const progress = ((activeTestInstance.currentIndex + 1) / totalQ) * 100;

      return `
        <div class="max-w-3xl mx-auto py-6 space-y-6 fade-in">
          
          <!-- TOP BAR -->
          <div class="glass-card rounded-3xl p-5 shadow-xl border border-white/20 flex items-center justify-between gap-4">
            <div>
              <span class="text-xs font-black px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-700">${t.level}</span>
              <h2 class="text-base font-black text-slate-800 mt-1">${t.title}</h2>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="autoSolveCurrentTest()" class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-black text-xs flex items-center gap-1.5 shadow-md shadow-indigo-500/20 transition-all transform active:scale-95" title="Tự động điền 100% đáp án đúng cho cả đề thi">
                <span>🤖</span> Tự Động Làm Bài
              </button>
              <div class="px-4 py-2 rounded-2xl bg-slate-900 text-amber-400 font-mono font-black text-base shadow-sm" id="testTimerDisplay">
                --:--
              </div>
              <button onclick="confirmExitTest()" class="px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold text-xs flex items-center gap-1.5 transition-all shadow-sm">
                <span>🚪</span> Thoát
              </button>
            </div>
          </div>

          <!-- PROGRESS BAR -->
          <div class="w-full bg-slate-800/40 rounded-full h-2 overflow-hidden">
            <div class="bg-gradient-to-r from-rose-500 to-amber-500 h-2 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
          </div>

          <!-- QUESTION CARD -->
          <div class="glass-card rounded-3xl p-6 sm:p-10 shadow-2xl border border-white/20 space-y-6">
            <div class="flex items-center justify-between text-xs font-bold text-slate-400 uppercase tracking-wider">
              <span>Câu hỏi ${activeTestInstance.currentIndex + 1} / ${totalQ}</span>
              <span class="text-rose-600">${q.type === 'mcq' ? 'Trắc nghiệm A B C D' : q.type === 'fill' ? 'Điền từ vào chỗ trống' : q.type === 'true_false' ? 'Phán đoán Đúng / Sai (对/错)' : 'Sắp xếp câu'}</span>
            </div>

            <!-- PROMPT -->
            <div class="text-center py-4">
              <h3 class="text-2xl sm:text-3xl font-black text-slate-800 leading-snug">${q.prompt}</h3>
              ${q.pinyin ? `<div class="text-sm font-bold text-rose-600 mt-2">Pinyin: ${q.pinyin}</div>` : ''}
              <button onclick="speakChinese('${q.prompt}')" class="mt-3 text-2xl hover:scale-110 transition-transform">🔊</button>
            </div>

            <!-- QUESTION CONTROLS BASED ON TYPE -->
            <div class="pt-2">
              ${q.type === 'mcq' ? renderTestMCQOptions(q) : ''}
              ${q.type === 'fill' ? renderTestFillBlank(q) : ''}
              ${q.type === 'true_false' ? renderTestTrueFalse(q) : ''}
              ${q.type === 'arrange' ? renderTestArrangeWords(q) : ''}
            </div>

            <!-- NAVIGATION BUTTONS -->
            <div class="pt-6 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2">
              <button onclick="navigateTest(-1)" ${activeTestInstance.currentIndex === 0 ? 'disabled class="opacity-40 cursor-not-allowed"' : ''} class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-xs text-slate-700 transition-all">
                &larr; Câu trước
              </button>

              <button onclick="autoSolveSingleQuestionUI()" class="px-3.5 py-2 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-xs border border-indigo-200 flex items-center gap-1.5 transition-all shadow-sm" title="Tự động điền đáp án chuẩn cho riêng câu này">
                <span>⚡</span> Tự Làm Câu Này
              </button>

              ${activeTestInstance.currentIndex === totalQ - 1 ? `
                <button onclick="submitTest(false)" class="px-6 py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black text-sm shadow-lg shadow-emerald-500/25 hover:opacity-95 transition-all">
                  Nộp Bài Thi ✅
                </button>
              ` : `
                <button onclick="navigateTest(1)" class="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs transition-all">
                  Câu tiếp &rarr;
                </button>
              `}
            </div>

          </div>

        </div>
      `;
    }

    function renderTestMCQOptions(q) {
      const selected = activeTestInstance.userAnswers[activeTestInstance.currentIndex];
      return `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-xl mx-auto">
          ${q.options.map((opt, i) => {
            const isSel = selected === opt;
            const letters = ['A', 'B', 'C', 'D'];
            return `
              <button onclick="selectTestAnswer('${opt}')" class="p-4 rounded-2xl border-2 text-left font-bold text-sm transition-all flex items-center gap-3 ${isSel ? 'border-rose-500 bg-rose-50 text-rose-700 shadow-sm' : 'border-slate-200 hover:border-slate-300 text-slate-700 bg-white'}">
                <span class="w-7 h-7 rounded-lg flex items-center justify-center font-black text-xs ${isSel ? 'bg-rose-500 text-white' : 'bg-slate-100 text-slate-500'}">
                  ${letters[i]}
                </span>
                <span class="text-base font-semibold">${opt}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderTestFillBlank(q) {
      const selected = activeTestInstance.userAnswers[activeTestInstance.currentIndex] || '';
      return `
        <div class="max-w-md mx-auto space-y-3">
          <input type="text" id="testFillInput" value="${selected}" oninput="activeTestInstance.userAnswers[activeTestInstance.currentIndex] = this.value.trim()" placeholder="Nhập từ Hán tự hoặc Pinyin..." 
                 class="w-full p-4 rounded-2xl border-2 border-slate-200 text-center font-bold text-lg text-slate-800 focus:outline-none focus:border-rose-500 focus:ring-4 focus:ring-rose-100 transition-all">
          ${q.hint ? `<p class="text-xs text-center text-slate-400 font-medium">💡 Gợi ý: ${q.hint}</p>` : ''}
        </div>
      `;
    }

    function renderTestArrangeWords(q) {
      const currentAnswer = activeTestInstance.userAnswers[activeTestInstance.currentIndex] || '';
      const selectedParts = currentAnswer ? currentAnswer.split(' ') : [];
      
      return `
        <div class="max-w-lg mx-auto space-y-6 text-center">
          
          <!-- ANSWER CONTAINER (DROP ZONE) -->
          <div class="min-h-[70px] p-3 rounded-2xl border-2 border-dashed border-rose-300 bg-rose-50/50 flex flex-wrap items-center justify-center gap-2">
            ${selectedParts.length === 0 ? `
              <span class="text-xs text-slate-400 font-medium">Nhấn vào các từ bên dưới để ghép vào đây</span>
            ` : selectedParts.map((p, i) => `
              <button onclick="removeArrangedPart(${i})" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-bold text-base shadow-sm hover:bg-rose-700 transition-all">
                ${p} &times;
              </button>
            `).join('')}
          </div>

          <!-- SOURCE PARTS -->
          <div class="flex flex-wrap items-center justify-center gap-2">
            ${q.parts.map(p => `
              <button onclick="addArrangedPart('${p}')" class="px-4 py-2.5 rounded-xl bg-white border-2 border-slate-200 text-slate-800 font-bold text-base hover:border-slate-400 shadow-sm transition-all transform active:scale-95">
                ${p}
              </button>
            `).join('')}
          </div>

          <button onclick="activeTestInstance.userAnswers[activeTestInstance.currentIndex] = ''; renderApp();" class="text-xs text-slate-400 hover:text-rose-600 font-semibold underline">
            Làm lại câu này
          </button>
        </div>
      `;
    }

    function renderTestTrueFalse(q) {
      const selected = activeTestInstance.userAnswers[activeTestInstance.currentIndex] || '';
      const opts = [
        { val: '对 (Đúng)', key: '对', label: '对 (Đúng)', icon: '✅' },
        { val: '错 (Sai)', key: '错', label: '错 (Sai)', icon: '❌' }
      ];
      return `
        <div class="grid grid-cols-2 gap-4 max-w-md mx-auto">
          ${opts.map(opt => {
            const isSel = selected === opt.val || selected === opt.key;
            return `
              <button onclick="selectTestAnswer('${opt.val}')" class="p-6 rounded-2xl border-2 font-black text-base flex flex-col items-center justify-center gap-2 transition-all card-hover ${isSel ? (opt.key === '对' ? 'border-emerald-500 bg-emerald-50 text-emerald-700 shadow-md ring-4 ring-emerald-100 scale-102' : 'border-rose-500 bg-rose-50 text-rose-700 shadow-md ring-4 ring-rose-100 scale-102') : 'border-slate-200 bg-white text-slate-700 hover:border-slate-300'}">
                <span class="text-4xl">${opt.icon}</span>
                <span class="text-lg">${opt.label}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    function selectTestAnswer(val) {
      activeTestInstance.userAnswers[activeTestInstance.currentIndex] = val;
      renderApp();
    }

    function addArrangedPart(part) {
      const curr = activeTestInstance.userAnswers[activeTestInstance.currentIndex] || '';
      const parts = curr ? curr.split(' ') : [];
      parts.push(part);
      activeTestInstance.userAnswers[activeTestInstance.currentIndex] = parts.join(' ');
      renderApp();
    }

    function removeArrangedPart(index) {
      const curr = activeTestInstance.userAnswers[activeTestInstance.currentIndex] || '';
      const parts = curr.split(' ');
      parts.splice(index, 1);
      activeTestInstance.userAnswers[activeTestInstance.currentIndex] = parts.join(' ');
      renderApp();
    }

    function navigateTest(dir) {
      activeTestInstance.currentIndex += dir;
      renderApp();
    }

    function confirmExitTest() {
      if (confirm('Bạn có chắc muốn thoát bài test dở dang? Điểm sẽ không được lưu.')) {
        clearInterval(activeTestInstance.timerInterval);
        activeTestInstance = null;
        currentRoute = 'student';
        renderApp();
      }
    }

    function submitTest(isAutoTimeout = false) {
      clearInterval(activeTestInstance.timerInterval);
      const t = activeTestInstance.test;
      let correct = 0;
      const details = [];

      t.questions.forEach((q, i) => {
        const userAns = (activeTestInstance.userAnswers[i] || '').trim().toLowerCase();
        const correctAns = (q.answer || '').trim().toLowerCase();
        let isRight = false;

        if (q.type === 'true_false') {
          const uClean = userAns.startsWith('对') ? '对' : (userAns.startsWith('错') ? '错' : userAns);
          const cClean = correctAns.startsWith('对') ? '对' : (correctAns.startsWith('错') ? '错' : correctAns);
          isRight = uClean === cClean;
        } else if (q.type === 'fill') {
          isRight = (userAns === correctAns) || (normalizePinyin(userAns) === normalizePinyin(correctAns));
        } else if (q.type === 'arrange') {
          isRight = userAns.replace(/\s+/g, '') === correctAns.replace(/\s+/g, '');
        } else {
          isRight = userAns === correctAns;
        }

        if (isRight) correct++;
        details.push({
          qIndex: i,
          prompt: q.prompt,
          studentAnswer: activeTestInstance.userAnswers[i] || '(Chưa làm)',
          correctAnswer: q.answer,
          explanation: q.explanation || '',
          correct: isRight
        });
      });

      const score = Math.round((correct / t.questions.length) * 100);
      const submissionId = 'sub_' + Date.now();

      db = loadDB();
      if (!db.submissions) db.submissions = [];
      db.submissions.unshift({
        id: submissionId,
        testId: t.id,
        studentId: currentUser.id,
        studentName: currentUser.fullName,
        level: currentUser.level,
        score: score,
        totalQuestions: t.questions.length,
        correctCount: correct,
        submittedAt: new Date().toLocaleString('vi-VN'),
        details: details
      });

      // Update student EXP and badges
      const studentIdx = db.users.findIndex(u => u.id === currentUser.id);
      if (studentIdx !== -1) {
        db.users[studentIdx].exp = (db.users[studentIdx].exp || 0) + (score >= 50 ? score : 20);
        if (!db.users[studentIdx].badges) db.users[studentIdx].badges = [];
        if (!db.users[studentIdx].badges.includes('first_test')) db.users[studentIdx].badges.push('first_test');
        if (score === 100 && !db.users[studentIdx].badges.includes('perfect_score')) db.users[studentIdx].badges.push('perfect_score');
      }

      saveDB(db);

      // Realtime upload to Supabase Cloud
      if (supabaseClient) {
        supabaseClient.from('chinese_submissions').insert([{
          id: submissionId,
          test_id: t.id,
          student_id: currentUser.id,
          student_name: currentUser.fullName,
          level: currentUser.level,
          score: score,
          total_questions: t.questions.length,
          correct_count: correct,
          details: details
        }]).then(() => console.log('Submission uploaded to Supabase Cloud!'));

        if (studentIdx !== -1) {
          supabaseClient.from('chinese_users').update({
            exp: db.users[studentIdx].exp,
            badges: db.users[studentIdx].badges
          }).eq('id', currentUser.id).then(() => console.log('Student EXP updated on Supabase!'));
        }
      }

      playSound(score >= 50 ? 'victory' : 'wrong');

      // Show result screen
      renderTestResultModal(t, score, correct, t.questions.length, details);
      activeTestInstance = null;
      currentRoute = 'student';
      renderApp();
    }

    // ==========================================
    // 9. STUDENT FILE UPLOAD & WORD PARSER (SHEETJS)
    // ==========================================
    function handleStudentUploadFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

          if (!rows || rows.length < 2) {
            alert('File rỗng hoặc không đủ dữ liệu.');
            return;
          }

          // Scan columns for Chinese characters
          let hanziIdx = -1;
          for (let r = 0; r < Math.min(10, rows.length); r++) {
            const row = rows[r];
            for (let c = 0; c < row.length; c++) {
              if (/[\u4e00-\u9fff]/.test(String(row[c]))) {
                hanziIdx = c;
                break;
              }
            }
            if (hanziIdx !== -1) break;
          }

          if (hanziIdx === -1) {
            alert('Không tìm thấy cột chữ Hán trong file Excel!');
            return;
          }

          const parsedWords = [];
          for (let r = 1; r < rows.length; r++) {
            const row = rows[r];
            if (!row || row.length <= hanziIdx) continue;
            const hz = String(row[hanziIdx] || '').trim();
            if (!hz || !/[\u4e00-\u9fff]/.test(hz)) continue;

            const py = String(row[hanziIdx + 1] || '').trim() || hz;
            const type = String(row[hanziIdx + 2] || '').trim() || 'Từ vựng';
            const mean = String(row[hanziIdx + 3] || '').trim() || 'Chưa có nghĩa';
            const exCN = String(row[hanziIdx + 4] || '').trim();
            const exVN = String(row[hanziIdx + 6] || '').trim();

            parsedWords.push({
              hanzi: hz,
              pinyin: py,
              type: type,
              meaning: mean,
              exampleCN: exCN,
              exampleVN: exVN
            });
          }

          if (parsedWords.length === 0) {
            alert('Không trích xuất được từ vựng hợp lệ.');
            return;
          }

          // Save to student profile in database!
          db = loadDB();
          const studentIdx = db.users.findIndex(u => u.id === currentUser.id);
          if (studentIdx !== -1) {
            db.users[studentIdx].currentFile = {
              fileName: file.name,
              wordCount: parsedWords.length,
              words: parsedWords
            };
            saveDB(db);
            currentUser = db.users[studentIdx];

            if (supabaseClient) {
              supabaseClient.from('chinese_users').update({
                current_file: db.users[studentIdx].currentFile
              }).eq('id', currentUser.id).then(() => console.log('File synced to Supabase Cloud!'));
            }

            showToast(`Đã nạp thành công ${parsedWords.length} từ từ file ${file.name}!`, '🎉');
            renderApp();
          }

        } catch (err) {
          console.error(err);
          alert('Lỗi đọc file Excel: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

          score++;
        } else {
          playSound('wrong');
        }
        idx++;
        if (idx >= arenaWords.length) {
          alert(`Hoàn thành! Bạn đúng ${score}/${arenaWords.length}`);
          arenaCurrentGame = null;
          renderApp();
        } else {
          draw();
        }
      };

      draw();
    }

    // GAME: MATCHING (NỐI TỪ HÁN - NGHĨA)
    function initArenaMatching(canvas) {
      if (!arenaWords || arenaWords.length === 0) return;
      const poolSize = Math.min(5, arenaWords.length);
      const selectedWords = [...arenaWords].sort(() => 0.5 - Math.random()).slice(0, poolSize);
      
      const hanziList = [...selectedWords].sort(() => 0.5 - Math.random());
      const meaningList = [...selectedWords].sort(() => 0.5 - Math.random());

      let selectedHanzi = null;
      let selectedMeaning = null;
      const matchedWords = new Set();
      let score = 0;

      function render() {
        canvas.innerHTML = `
          <div class="max-w-2xl mx-auto space-y-6">
            <div class="flex items-center justify-between text-xs font-bold">
              <button onclick="arenaCurrentGame = null; renderApp();" class="text-slate-400 hover:text-rose-600">&larr; Thoát Game</button>
              <div class="flex items-center gap-4">
                <span class="text-slate-500 font-semibold">Đã nối: <b class="text-emerald-600">${matchedWords.size} / ${selectedWords.length}</b></span>
                <span class="text-amber-500 font-black text-sm">⭐ ${score}</span>
              </div>
            </div>

            <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-xl border border-white/20 space-y-4">
              <div class="text-center">
                <h3 class="text-lg font-black text-slate-800">🔗 Nối Cặp Chữ Hán & Ý Nghĩa</h3>
                <p class="text-xs text-slate-400 mt-1">Bấm chọn 1 ô chữ Hán và 1 ô ý nghĩa tương ứng để ghép đôi</p>
              </div>

              <div class="grid grid-cols-2 gap-3 sm:gap-6 pt-2">
                <!-- LEFT: HANZI -->
                <div class="space-y-2.5">
                  <div class="text-xs font-bold text-center text-slate-400 uppercase tracking-wider mb-2">Chữ Hán (汉字)</div>
                  ${hanziList.map(item => {
                    const isMatched = matchedWords.has(item.hanzi);
                    const isSelected = selectedHanzi === item.hanzi;
                    return `
                      <button onclick="window._onSelectHanziMatch('${item.hanzi}')" 
                        ${isMatched ? 'disabled' : ''}
                        class="w-full p-3.5 sm:p-4 rounded-2xl border-2 font-black transition-all flex items-center justify-between text-left
                          ${isMatched 
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-400 opacity-40 cursor-not-allowed line-through' 
                            : isSelected 
                              ? 'border-rose-500 bg-rose-50 text-rose-700 shadow-md ring-4 ring-rose-100 scale-102' 
                              : 'bg-white border-slate-200 hover:border-slate-300 text-slate-800 shadow-sm'}">
                        <span class="text-xl sm:text-2xl">${item.hanzi}</span>
                        <span class="text-xs font-semibold text-rose-500">${arenaShowPinyin ? item.pinyin : ''}</span>
                      </button>
                    `;
                  }).join('')}
                </div>

                <!-- RIGHT: MEANING -->
                <div class="space-y-2.5">
                  <div class="text-xs font-bold text-center text-slate-400 uppercase tracking-wider mb-2">Ý Nghĩa Tiếng Việt</div>
                  ${meaningList.map(item => {
                    const isMatched = matchedWords.has(item.hanzi);
                    const isSelected = selectedMeaning === item.meaning;
                    return `
                      <button onclick="window._onSelectMeaningMatch('${item.meaning}')" 
                        ${isMatched ? 'disabled' : ''}
                        class="w-full p-3.5 sm:p-4 rounded-2xl border-2 font-bold text-sm transition-all flex items-center justify-center text-center min-h-[58px]
                          ${isMatched 
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-400 opacity-40 cursor-not-allowed line-through' 
                            : isSelected 
                              ? 'border-rose-500 bg-rose-50 text-rose-700 shadow-md ring-4 ring-rose-100 scale-102' 
                              : 'bg-white border-slate-200 hover:border-slate-300 text-slate-700 shadow-sm'}">
                        <span>${item.meaning}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>

            ${matchedWords.size === selectedWords.length ? `
              <div class="glass-card rounded-3xl p-6 text-center space-y-4 pop-in border border-emerald-200 bg-emerald-50/50">
                <div class="text-4xl">🎉</div>
                <h4 class="text-lg font-black text-emerald-800">Xuất Sắc! Bạn Đã Nối Đúng Tất Cả Cặp Từ!</h4>
                <div class="flex items-center justify-center gap-3">
                  <button onclick="initArenaMatching(document.getElementById('arenaCanvas'))" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md transition-all">
                    🔄 Chơi Ván Mới
                  </button>
                  <button onclick="arenaCurrentGame = null; renderApp();" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-xs transition-all">
                    Về Menu Game
                  </button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      window._onSelectHanziMatch = (hanzi) => {
        if (matchedWords.has(hanzi)) return;
        selectedHanzi = hanzi;
        speakChinese(hanzi);
        checkMatch();
        render();
      };

      window._onSelectMeaningMatch = (meaning) => {
        selectedMeaning = meaning;
        checkMatch();
        render();
      };

      function checkMatch() {
        if (!selectedHanzi || !selectedMeaning) return;
        const target = selectedWords.find(w => w.hanzi === selectedHanzi);
        if (target && target.meaning === selectedMeaning) {
          matchedWords.add(selectedHanzi);
          playSound('correct');
          showFloatScore('+10', 'text-emerald-500');
          score += 10;
          selectedHanzi = null;
          selectedMeaning = null;
          if (matchedWords.size === selectedWords.length) {
            playSound('victory');
          }
        } else {
          playSound('wrong');
          const prevH = selectedHanzi;
          const prevM = selectedMeaning;
          setTimeout(() => {
            if (selectedHanzi === prevH && selectedMeaning === prevM) {
              selectedHanzi = null;
              selectedMeaning = null;
              render();
            }
          }, 600);
        }
      }

      render();
    }

    // GAME: TYPING (LUYỆN GÕ PINYIN)
    function initArenaTyping(canvas) {
      if (!arenaWords || arenaWords.length === 0) return;
      const words = [...arenaWords].sort(() => 0.5 - Math.random());
      let idx = 0;
      let score = 0;
      let streak = 0;
      let lastResult = null;

      function render() {
        const w = words[idx];
        canvas.innerHTML = `
          <div class="max-w-md mx-auto space-y-6">
            <div class="flex items-center justify-between text-xs font-bold text-slate-400">
              <button onclick="arenaCurrentGame = null; renderApp();" class="hover:text-rose-600">&larr; Thoát Game</button>
              <div class="flex items-center gap-3">
                <span>🔥 Chuỗi: <b class="text-rose-600">${streak}</b></span>
                <span>⭐ Điểm: <b class="text-amber-500">${score}</b></span>
                <span>${idx + 1} / ${words.length}</span>
              </div>
            </div>

            <div class="glass-card rounded-3xl p-8 text-center shadow-xl border border-white/20 space-y-4">
              <div class="text-xs font-bold text-slate-400 uppercase">Nhìn chữ Hán & gõ đúng Pinyin:</div>
              <div class="hanzi-large font-black text-slate-800">${w.hanzi}</div>
              <div class="text-base font-bold text-emerald-600">Nghĩa: ${w.meaning}</div>
              ${w.type ? `<div class="text-xs text-slate-400">(${w.type})</div>` : ''}
              <button onclick="speakChinese('${w.hanzi}')" class="text-2xl hover:scale-110 transition-transform">🔊</button>
            </div>

            <div class="space-y-3">
              <form onsubmit="window._submitPinyin(event)" class="space-y-3">
                <input type="text" id="arenaPinyinInput" autofocus autocomplete="off" autocapitalize="off" spellcheck="false"
                       placeholder="Nhập pinyin (VD: ni hao hoặc nǐ hǎo)..." 
                       class="w-full p-4 rounded-2xl border-2 border-slate-200 text-center font-bold text-lg text-slate-800 focus:outline-none focus:border-rose-500 focus:ring-4 focus:ring-rose-100 transition-all">
                <div class="flex gap-2">
                  <button type="button" onclick="window._skipPinyin()" class="flex-1 py-3.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs transition-all">
                    Bỏ qua
                  </button>
                  <button type="submit" class="flex-2 py-3.5 rounded-xl bg-gradient-to-r from-rose-600 to-amber-600 text-white font-bold text-xs shadow-md hover:opacity-95 transition-all">
                    Kiểm Tra &rarr;
                  </button>
                </div>
              </form>

              ${lastResult ? `
                <div class="p-4 rounded-2xl text-center text-xs font-bold pop-in ${lastResult.isCorrect ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}">
                  ${lastResult.isCorrect ? '🎉 Chính xác!' : `❌ Chưa đúng! Đáp án chuẩn: <b>${lastResult.answer}</b>`}
                </div>
              ` : `
                <p class="text-[11px] text-center text-slate-400 font-medium">
                  💡 Chấp nhận cả gõ không dấu (như: <b>${w.pinyin.normalize('NFD').replace(/[\u0300-\u036f]/g, '')}</b>) hoặc có dấu!
                </p>
              `}
            </div>
          </div>
        `;

        setTimeout(() => {
          const input = document.getElementById('arenaPinyinInput');
          if (input) input.focus();
        }, 100);
      }

      window._submitPinyin = (e) => {
        e.preventDefault();
        const input = document.getElementById('arenaPinyinInput');
        if (!input) return;
        const val = input.value.trim().toLowerCase();
        const w = words[idx];
        if (!val) return;

        const targetPinyin = w.pinyin.toLowerCase().trim();
        const isCorrect = (val === targetPinyin) || (normalizePinyin(val) === normalizePinyin(targetPinyin));

        if (isCorrect) {
          playSound('correct');
          showFloatScore('+10', 'text-emerald-500');
          score += 10;
          streak++;
          lastResult = { isCorrect: true, answer: w.pinyin };
        } else {
          playSound('wrong');
          streak = 0;
          lastResult = { isCorrect: false, answer: w.pinyin };
        }
        render();

        setTimeout(() => {
          lastResult = null;
          if (idx < words.length - 1) {
            idx++;
            render();
          } else {
            alert(`Hoàn thành thử thách gõ Pinyin! Điểm số: ${score}`);
            arenaCurrentGame = null;
            renderApp();
          }
        }, isCorrect ? 900 : 1800);
      };

      window._skipPinyin = () => {
        const w = words[idx];
        lastResult = { isCorrect: false, answer: w.pinyin };
        render();
        setTimeout(() => {
          lastResult = null;
          if (idx < words.length - 1) {
            idx++;
            render();
          } else {
            arenaCurrentGame = null;
            renderApp();
          }
        }, 1200);
      };

      render();
    }

    // GAME: FILL BLANK (ĐIỀN TỪ VÀO CÂU)
    function initArenaFillBlank(canvas) {
      if (!arenaWords || arenaWords.length === 0) return;
      const words = [...arenaWords].sort(() => 0.5 - Math.random());
      let idx = 0;
      let score = 0;

      function render() {
        const w = words[idx];
        let sentence = w.exampleCN || '';

        }

        const others = arenaWords.filter(x => x.hanzi !== w.hanzi).sort(() => 0.5 - Math.random()).slice(0, 3);
        const options = [w, ...others].sort(() => 0.5 - Math.random());

        canvas.innerHTML = `
          <div class="max-w-lg mx-auto space-y-6">
            <div class="flex items-center justify-between text-xs font-bold text-slate-400">
              <button onclick="arenaCurrentGame = null; renderApp();" class="hover:text-rose-600">&larr; Thoát Game</button>
              <span>⭐ Điểm: <b class="text-amber-500">${score}</b></span>

              <div class="text-sm font-semibold text-slate-500">

            </div>

            <div class="grid grid-cols-2 gap-3" id="fillBlankOptions">
              ${options.map(opt => `
                <button onclick="window._answerFillBlank('${opt.hanzi}', '${w.hanzi}', this)" 
                  class="p-4 rounded-2xl bg-white border-2 border-slate-200 font-bold text-slate-800 hover:border-rose-400 card-hover transition-all text-center flex flex-col items-center justify-center gap-1">
                  <span class="text-xl font-black">${opt.hanzi}</span>
                  <span class="text-xs font-semibold text-rose-500">${arenaShowPinyin ? opt.pinyin : ''}</span>
                  <span class="text-[11px] text-slate-400">${opt.meaning}</span>
                </button>
              `).join('')}
            </div>
          </div>

      }

      window._answerFillBlank = (chosen, correct, btn) => {
        const isRight = chosen === correct;
        if (isRight) {
          btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
          playSound('correct');
          showFloatScore('+10', 'text-emerald-500');

          speakChinese(words[idx].exampleCN || correct);
        } else {
          btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-700', 'shake');
          playSound('wrong');
        }

        setTimeout(() => {
          if (idx < words.length - 1) {
            idx++;
            render();

            alert(`Hoàn thành thử thách điền từ! Điểm số: ${score}`);
            arenaCurrentGame = null;
            renderApp();
          }
        }, isRight ? 1000 : 1500);
      };

      render();
    }

    // GAME: MEMORY (TRÍ NHỚ LẬT THẺ)
    function initArenaMemory(canvas) {
      if (!arenaWords || arenaWords.length === 0) return;
      const numPairs = Math.min(6, arenaWords.length);
      const picked = [...arenaWords].sort(() => 0.5 - Math.random()).slice(0, numPairs);

      const rawCards = [];
      picked.forEach((w, i) => {
        rawCards.push({
          pairId: i,
          type: 'hanzi',
          text: w.hanzi,
          subText: arenaShowPinyin ? w.pinyin : '',
          meaning: w.meaning
        });
        rawCards.push({
          pairId: i,
          type: 'meaning',
          text: w.meaning,
          subText: arenaShowPinyin ? w.pinyin : '',
          hanzi: w.hanzi
        });
      });

      const cards = rawCards.sort(() => 0.5 - Math.random()).map((c, idx) => ({
        ...c,
        id: idx,
        isFlipped: false,
        isMatched: false
      }));

      let flipped = [];
      let moves = 0;
      let matchedCount = 0;
      let isLocked = false;

      function render() {
        canvas.innerHTML = `
          <div class="max-w-2xl mx-auto space-y-6">
            <div class="flex items-center justify-between text-xs font-bold text-slate-400">
              <button onclick="arenaCurrentGame = null; renderApp();" class="hover:text-rose-600">&larr; Thoát Game</button>
              <div class="flex items-center gap-4">
                <span>🎮 Lượt lật: <b class="text-slate-800">${moves}</b></span>
                <span>🎯 Cặp đúng: <b class="text-emerald-600">${matchedCount} / ${numPairs}</b></span>
              </div>
            </div>

            <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-xl border border-white/20">
              <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
                ${cards.map((c, i) => `
                  <div onclick="window._flipMemoryCard(${i})" 
                    class="min-h-[90px] sm:min-h-[110px] rounded-2xl flex flex-col items-center justify-center p-3 text-center cursor-pointer transition-all duration-300 transform select-none
                      ${c.isMatched 
                        ? 'bg-emerald-50 border-2 border-emerald-400 text-emerald-800 scale-95 shadow-sm' 
                        : c.isFlipped 
                          ? 'bg-white border-2 border-rose-400 text-slate-800 shadow-md scale-102' 
                          : 'bg-gradient-to-br from-rose-600 to-amber-600 text-white font-black text-2xl shadow-md hover:scale-105 active:scale-95'}">
                    ${(c.isFlipped || c.isMatched) ? `
                      <div class="${c.type === 'hanzi' ? 'text-2xl font-black' : 'text-sm font-bold leading-tight'}">
                        ${c.text}
                      </div>
                      ${c.subText ? `<div class="text-[10px] font-semibold text-rose-500 mt-1">${c.subText}</div>` : ''}
                    ` : `
                      <span class="text-2xl">🀄</span>
                    `}
                  </div>
                `).join('')}
              </div>
            </div>

            ${matchedCount === numPairs ? `
              <div class="glass-card rounded-3xl p-6 text-center space-y-4 pop-in border border-emerald-200 bg-emerald-50/50">
                <div class="text-4xl">🏆</div>
                <h4 class="text-lg font-black text-emerald-800">Trí Nhớ Siêu Phàm! Bạn Đã Mở Hết Sau ${moves} Lượt!</h4>
                <div class="flex items-center justify-center gap-3">
                  <button onclick="initArenaMemory(document.getElementById('arenaCanvas'))" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md transition-all">
                    🔄 Chơi Ván Mới
                  </button>
                  <button onclick="arenaCurrentGame = null; renderApp();" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-xs transition-all">
                    Về Menu Game
                  </button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      window._flipMemoryCard = (idx) => {
        if (isLocked) return;
        const card = cards[idx];
        if (card.isFlipped || card.isMatched) return;

        card.isFlipped = true;
        flipped.push(card);
        if (card.type === 'hanzi') speakChinese(card.text);
        render();

        if (flipped.length === 2) {
          moves++;
          isLocked = true;
          const [c1, c2] = flipped;

          if (c1.pairId === c2.pairId && c1.type !== c2.type) {
            setTimeout(() => {
              c1.isMatched = true;
              c2.isMatched = true;
              matchedCount++;
              playSound('correct');
              flipped = [];
              isLocked = false;
              if (matchedCount === numPairs) {
                playSound('victory');
              }
              render();
            }, 500);
          } else {
            setTimeout(() => {
              playSound('wrong');
              c1.isFlipped = false;
              c2.isFlipped = false;
              flipped = [];
              isLocked = false;
              render();
            }, 900);
          }
        }
      };

      render();
    }

      db = loadDB();

        alert(`Bí danh / Tên đăng nhập "@${user}" đã tồn tại! Vui lòng chọn bí danh khác.`);
        return;
      }

      const newStudent = {
        id: 'u_' + Date.now(),
        fullName: name,

    function handleSaveStudentEdit(e, studentId) {
      e.preventDefault();
      const newName = document.getElementById('editStudentFullName').value.trim();
      let newUsername = document.getElementById('editStudentUsername').value.trim().replace(/^@+/, '');
      const newPass = document.getElementById('editStudentPassword').value.trim();
      const newLevel = document.getElementById('editStudentLevel').value;

      if (!newName || !newUsername || !newPass) {
        alert('Vui lòng điền đầy đủ thông tin!');
        return;
      }

      db = loadDB();
      const existing = db.users.find(u => u.username.toLowerCase() === newUsername.toLowerCase() && u.id !== studentId);
      if (existing) {
        alert(`Bí danh "@${newUsername}" đã tồn tại. Vui lòng chọn bí danh khác!`);
        return;
      }

      const sIdx = db.users.findIndex(u => u.id === studentId);
      if (sIdx !== -1) {
        db.users[sIdx].fullName = newName;
        db.users[sIdx].username = newUsername;
        db.users[sIdx].password = newPass;
        db.users[sIdx].level = newLevel;
        saveDB(db);

        if (supabaseClient) {
          supabaseClient.from('chinese_users').update({
            full_name: newName,
            username: newUsername,
            password: newPass,
            level: newLevel
          }).eq('id', studentId).then(() => console.log('Student updated in Supabase!'));
        }

        document.getElementById('modalHost').innerHTML = '';
        showToast(`Đã cập nhật thông tin học viên ${newName}!`, '🎉');
        renderApp();
      }
    }

    function handleQTypeChange(selectEl) {
      const row = selectEl.closest('.q-builder-item');
      if (!row) return;
      const type = selectEl.value;

      const mcqBox = row.querySelector('.q-mcq-box');
      const fillBox = row.querySelector('.q-fill-box');
      const tfBox = row.querySelector('.q-tf-box');
      const arrangeBox = row.querySelector('.q-arrange-box');
      const answerBox = row.querySelector('.q-answer-box');
      const promptInput = row.querySelector('.q-prompt');
      const answerInput = row.querySelector('.q-answer');

      mcqBox.classList.add('hidden');
      fillBox.classList.add('hidden');
      tfBox.classList.add('hidden');
      arrangeBox.classList.add('hidden');
      answerBox.classList.remove('hidden');

      if (type === 'mcq') {
        mcqBox.classList.remove('hidden');
        promptInput.placeholder = "Nội dung câu hỏi (VD: Từ '你好' có nghĩa là gì?)";
        answerInput.placeholder = "Đáp án ĐÚNG CHÍNH XÁC (Trùng với 1 trong 4 đáp án trên)";
      } else if (type === 'fill') {
        fillBox.classList.remove('hidden');
        promptInput.placeholder = "Câu có chỗ trống (Dùng _____ biểu thị chỗ trống, VD: 我想去 _____ 旅游。)";
        answerInput.placeholder = "Từ cần điền chính xác vào chỗ trống (VD: 中国)";
      } else if (type === 'true_false') {
        tfBox.classList.remove('hidden');
        answerBox.classList.add('hidden'); // Choice is made in q-tf-select

    function handleSaveNewTest() {
      const title = document.getElementById('newTestTitle').value.trim();
      const level = document.getElementById('newTestLevel').value;
      const duration = parseInt(document.getElementById('newTestDuration').value) || 10;
      const targetTypeRadio = document.querySelector('input[name="testTargetType"]:checked');
      const targetType = targetTypeRadio ? targetTypeRadio.value : 'ALL';

      if (!title) {
        alert('Vui lòng nhập tên bài test!');
        return;
      }

      let targetStudentIds = [];
      if (targetType === 'SPECIFIC') {
        const checkedBoxes = document.querySelectorAll('.assign-student-cb:checked');
        targetStudentIds = Array.from(checkedBoxes).map(cb => cb.value);
        if (targetStudentIds.length === 0) {
          alert('Bạn đang chọn "Chỉ định học viên cụ thể", vui lòng tích chọn ít nhất 1 học viên để giao bài!');
          return;
        }
      }

      const rows = document.querySelectorAll('.q-builder-item');
      const questions = [];

      rows.forEach((r, idx) => {
        const type = r.querySelector('.q-type-select').value;
        const prompt = r.querySelector('.q-prompt').value.trim();
        const ansInput = r.querySelector('.q-answer');
        const ans = ansInput ? ansInput.value.trim() : '';

        if (!prompt) return;

        if (type === 'mcq') {
          const optA = r.querySelector('.q-opt-a').value.trim();
          const optB = r.querySelector('.q-opt-b').value.trim();
          const optC = r.querySelector('.q-opt-c').value.trim();
          const optD = r.querySelector('.q-opt-d').value.trim();
          if (ans) {
            questions.push({
              id: 'q_' + (idx + 1),
              type: 'mcq',
              prompt: prompt,
              options: [optA || ans, optB || 'Đáp án B', optC || 'Đáp án C', optD || 'Đáp án D'],
              answer: ans,
              explanation: 'Đáp án chuẩn: ' + ans
            });
          }
        } else if (type === 'fill') {
          const hint = r.querySelector('.q-hint') ? r.querySelector('.q-hint').value.trim() : '';
          if (ans) {
            questions.push({
              id: 'q_' + (idx + 1),
              type: 'fill',
              prompt: prompt,
              hint: hint,
              answer: ans,
              explanation: 'Đáp án chuẩn cần điền: ' + ans
            });
          }
        } else if (type === 'true_false') {
          const tfSelect = r.querySelector('.q-tf-select');
          const tfVal = tfSelect ? tfSelect.value : '对 (Đúng)';
          questions.push({
            id: 'q_' + (idx + 1),
            type: 'true_false',
            prompt: prompt,
            answer: tfVal,
            explanation: 'Khẳng định này là ' + tfVal
          });
        } else if (type === 'arrange') {
          const partsInput = r.querySelector('.q-arrange-parts');
          const partsRaw = partsInput ? partsInput.value.trim() : '';
          const parts = partsRaw.split('/').map(p => p.trim()).filter(Boolean);
          if (ans && parts.length > 0) {
            questions.push({
              id: 'q_' + (idx + 1),
              type: 'arrange',
              prompt: prompt,
              parts: parts.sort(() => 0.5 - Math.random()),
              answer: ans.replace(/\s+/g, ''),
              explanation: 'Câu hoàn chỉnh: ' + ans
            });
          }
        }
      });

      if (questions.length === 0) {
        alert('Vui lòng nhập ít nhất 1 câu hỏi hợp lệ và điền đầy đủ đáp án đúng!');
        return;
      }

      db = loadDB();
      if (!db.tests) db.tests = [];
      const newTest = {
        id: 'test_' + Date.now(),
        title: title,
        level: level,
        durationMinutes: duration,
        targetType: targetType,
        targetStudentIds: targetStudentIds,
        createdAt: new Date().toISOString().split('T')[0],
        questions: questions
      };

      db.tests.unshift(newTest);
      saveDB(db);

      if (supabaseClient) {
        supabaseClient.from('chinese_tests').insert([{
          id: newTest.id,
          title: newTest.title,
          level: newTest.level,
          duration_minutes: newTest.durationMinutes,
          questions: [
            { _testMeta: { targetType: newTest.targetType, targetStudentIds: newTest.targetStudentIds } },
            ...newTest.questions
          ]
        }]).then(() => console.log('Test created and synced to Supabase Cloud!'));
      }

      document.getElementById('modalHost').innerHTML = '';
      showToast(`Đã lưu bài test "${title}"!`, '🎉');
      renderApp();
    }

      }

      document.getElementById('modalHost').innerHTML = '';
      showToast(`🎉 Đã tự động tạo và phát hành đề "${title}" (${questions.length} câu)!`, '🚀');
      renderApp();
    }

    function handleAutoCreateAndReviewInEditor() {
      const title = document.getElementById('autoTestTitle')?.value.trim() || 'Đề Kiểm Tra Tự Động';
      const level = document.getElementById('autoTestLevel')?.value || 'HSK1';
      const count = parseInt(document.getElementById('autoTestCount')?.value) || 10;
      const duration = parseInt(document.getElementById('autoTestDuration')?.value) || 15;
      const types = getSelectedAutoTypes();
      const words = getAllWordsForLevel(level);
      const questions = generateQuestionsFromWords(words, count, types);

      // Open manual editor
      openCreateTestModal();

      // Pre-fill fields
      const titleEl = document.getElementById('newTestTitle');
      if (titleEl) titleEl.value = title;
      const levelEl = document.getElementById('newTestLevel');
      if (levelEl) levelEl.value = level;
      const durEl = document.getElementById('newTestDuration');
      if (durEl) durEl.value = duration;

      // Fill questions into container
      const container = document.getElementById('questionsBuilderContainer');
      if (container) {
        container.innerHTML = '';
        questions.forEach((q, idx) => {
          insertQuestionObjectToBuilder(container, q, idx + 1);
        });
        const qCountEl = document.getElementById('testQCount');
        if (qCountEl) qCountEl.textContent = questions.length;
      }

      showToast(`✨ Đã sinh ${questions.length} câu hỏi vào trình soạn thảo!`, '📝');
    }

    function insertQuestionObjectToBuilder(container, q, num) {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = renderQuestionRowHTML(num);
      const row = tempDiv.firstElementChild;
      container.appendChild(row);

      const typeSelect = row.querySelector('.q-type-select');
      if (typeSelect) {
        typeSelect.value = q.type;
        handleQTypeChange(typeSelect);
      }

      const promptInput = row.querySelector('.q-prompt');
      if (promptInput) promptInput.value = q.prompt || '';

      if (q.type === 'mcq') {
        const opts = q.options || [];
        if (row.querySelector('.q-opt-a')) row.querySelector('.q-opt-a').value = opts[0] || '';
        if (row.querySelector('.q-opt-b')) row.querySelector('.q-opt-b').value = opts[1] || '';
        if (row.querySelector('.q-opt-c')) row.querySelector('.q-opt-c').value = opts[2] || '';
        if (row.querySelector('.q-opt-d')) row.querySelector('.q-opt-d').value = opts[3] || '';
        if (row.querySelector('.q-answer')) row.querySelector('.q-answer').value = q.answer || '';
      } else if (q.type === 'fill') {
        if (row.querySelector('.q-hint')) row.querySelector('.q-hint').value = q.hint || '';
        if (row.querySelector('.q-answer')) row.querySelector('.q-answer').value = q.answer || '';
      } else if (q.type === 'true_false') {
        const tfSelect = row.querySelector('.q-tf-select');
        if (tfSelect) tfSelect.value = q.answer || '对 (Đúng)';
      } else if (q.type === 'arrange') {
        const parts = q.parts || (q.answer ? q.answer.split(' ') : []);
        if (row.querySelector('.q-arrange-parts')) row.querySelector('.q-arrange-parts').value = parts.join(' / ');
        if (row.querySelector('.q-answer')) row.querySelector('.q-answer').value = q.answer || '';
      }
    }

    function autoGenerateQuestionsIntoForm() {
      const levelEl = document.getElementById('newTestLevel');
      const level = levelEl ? levelEl.value : 'HSK1';
      const words = getAllWordsForLevel(level);
      const questions = generateQuestionsFromWords(words, 5, ['mcq', 'fill', 'true_false', 'arrange']);
      
      const container = document.getElementById('questionsBuilderContainer');
      if (!container) return;

      // If existing rows have only 1 row and prompt is empty, remove it
      const existingRows = container.querySelectorAll('.q-builder-item');
      if (existingRows.length === 1) {
        const firstPrompt = existingRows[0].querySelector('.q-prompt')?.value.trim();
        if (!firstPrompt) {
          container.innerHTML = '';
        }
      }

      const startIdx = container.querySelectorAll('.q-builder-item').length;
      questions.forEach((q, i) => {
        insertQuestionObjectToBuilder(container, q, startIdx + i + 1);
      });

      const total = container.querySelectorAll('.q-builder-item').length;
      const countEl = document.getElementById('testQCount');
      if (countEl) countEl.textContent = total;

      showToast(`✨ Đã tự động sinh thêm 5 câu hỏi chuẩn ${level} vào form!`, '🎉');
    }

    function studentGeneratePracticeTest() {
      if (!currentUser) return;
      const level = currentUser.level || 'HSK1';
      const words = getAllWordsForLevel(level);
      if (!words || words.length === 0) {
        alert('Không tìm thấy từ vựng để tạo đề thi thử.');
        return;
      }
      const testId = 'practice_' + Date.now();
      const testNum = Math.floor(1000 + Math.random() * 9000);
      const questions = generateQuestionsFromWords(words, 10, ['mcq', 'fill', 'true_false', 'arrange']);

      const practiceTest = {
        id: testId,
        title: `Đề Thi Thử Tự Luyện ${level} (#${testNum})`,
        level: level,
        durationMinutes: 15,
        targetType: 'SPECIFIC',
        targetStudentIds: [currentUser.id],
        isPractice: true,
        createdAt: new Date().toISOString().split('T')[0],
        questions: questions
      };

      db = loadDB();
      if (!db.tests) db.tests = [];
      db.tests.unshift(practiceTest);
      saveDB(db);

      if (supabaseClient) {
        supabaseClient.from('chinese_tests').insert([{
          id: practiceTest.id,
          title: practiceTest.title,
          level: practiceTest.level,
          duration_minutes: practiceTest.durationMinutes,
          questions: [
            { _testMeta: { targetType: practiceTest.targetType, targetStudentIds: practiceTest.targetStudentIds, isPractice: true } },
            ...practiceTest.questions
          ]
        }]).then(() => console.log('Practice test synced to Supabase!'));
      }

      showToast(`🎉 Đã tạo đề tự luyện 10 câu cho cấp độ ${level}!`, '🎲');

      if (confirm(`Đề thi thử ${level} (10 câu, 15 phút) đã sẵn sàng!\nBạn có muốn bắt đầu làm bài ngay bây giờ không?`)) {
        startTest(practiceTest);
      } else {
        renderApp();
      }
    }

    // ==========================================
    // 8.2 AUTO-SOLVE TEST LOGIC (AI HELPER)
    // ==========================================
    function autoSolveCurrentTest() {
      if (!activeTestInstance) return;
      const t = activeTestInstance.test;
      if (!confirm(`Bạn có muốn tự động điền toàn bộ đáp án chính xác cho ${t.questions.length} câu hỏi của bài thi này không?`)) {
        return;
      }
      t.questions.forEach((q, i) => {
        autoSolveQuestionAt(q, i);
      });
      showToast(`🤖 AI đã tự động điền đáp án chuẩn cho toàn bộ ${t.questions.length} câu!`, '✨');
      renderApp();
    }

    function autoSolveSingleQuestionUI() {
      if (!activeTestInstance) return;
      const i = activeTestInstance.currentIndex;
      const q = activeTestInstance.test.questions[i];
      autoSolveQuestionAt(q, i);
      showToast(`💡 Đã tự động điền đáp án chuẩn cho câu ${i + 1}!`, '✨');
      renderApp();
    }

    function autoSolveQuestionAt(q, idx) {
      if (q.type === 'mcq') {
        activeTestInstance.userAnswers[idx] = q.answer;
      } else if (q.type === 'fill') {
        activeTestInstance.userAnswers[idx] = q.answer;
      } else if (q.type === 'true_false') {
        activeTestInstance.userAnswers[idx] = q.answer;
      } else if (q.type === 'arrange') {
        if (q.answer) {
          const parts = q.answer.split(' ').filter(Boolean);
          if (parts.length > 1) {
            activeTestInstance.userAnswers[idx] = parts.join(' ');
          } else if (q.parts && q.parts.length > 0) {
            activeTestInstance.userAnswers[idx] = q.parts.join(' ');
          } else {
            activeTestInstance.userAnswers[idx] = q.answer;
          }
        } else {
          activeTestInstance.userAnswers[idx] = q.answer;
        }
      } else {
        activeTestInstance.userAnswers[idx] = q.answer;
      }
    }

      const modal = document.getElementById('modalHost');

              <div>
                <h3 class="text-lg font-black text-slate-800">${sub.studentName}</h3>
                <span class="text-xs text-slate-400">Điểm: <b class="text-emerald-600 text-sm">${sub.score}/100</b> (${sub.submittedAt})</span>
              </div>

    // WORD BANK MODAL
    function openWordBankModal() {
      const modal = document.getElementById('modalHost');

      modal.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="glass-card rounded-3xl p-6 sm:p-8 max-w-3xl w-full shadow-2xl border border-white/20 pop-in space-y-4 max-h-[90vh] flex flex-col">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 class="text-lg font-black text-slate-800">📖 Kho Từ Vựng (${list.length} từ)</h3>
              <button onclick="document.getElementById('modalHost').innerHTML=''" class="text-slate-400 hover:text-rose-600 text-2xl font-bold">&times;</button>
            </div>

            <div class="flex-1 overflow-y-auto space-y-2 pr-1">
              <table class="w-full text-left text-sm">

                  <tr class="text-xs font-black text-slate-400 uppercase border-b border-slate-100">
                    <th class="py-2">Chữ Hán</th>
                    <th class="py-2">Pinyin</th>
                    <th class="py-2">Nghĩa Tiếng Việt</th>
                    <th class="py-2 text-center">Nghe</th>

                </thead>

                      <td class="py-3 font-bold text-base text-slate-800">${w.hanzi}</td>
                      <td class="py-3 font-semibold text-rose-600">${w.pinyin}</td>
                      <td class="py-3 text-slate-600 font-medium">${w.meaning}</td>
                      <td class="py-3 text-center">
                        <button onclick="speakChinese('${w.hanzi}')" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200">🔊</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <button onclick="document.getElementById('modalHost').innerHTML=''" class="w-full py-3 rounded-xl bg-slate-900 text-white font-bold text-xs">Đóng</button>

    // ==========================================
    // 12. ROUTER & ROOT APP RENDERER
    // ==========================================
    function renderApp() {
      const view = document.getElementById('appView');
      if (!view) return;

      if (!currentUser || currentRoute === 'login') {
        view.innerHTML = renderLoginView();
      } else if (currentRoute === 'manager') {
        view.innerHTML = renderManagerView();
      } else if (currentRoute === 'student') {
        view.innerHTML = renderStudentView();
      } else if (currentRoute === 'test_runner') {
        view.innerHTML = renderTestRunnerView();
      } else if (currentRoute === 'game_arena') {
        view.innerHTML = renderVocabArenaView();
      }
    }

    // STARTUP
    checkSession();
  </script>
